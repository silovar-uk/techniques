name: Add Techniques favicon link

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-favicon-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add favicon link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          link = '  <link rel="icon" href="favicon.svg" type="image/svg+xml">\n'
          if 'href="favicon.svg"' not in html:
              html = html.replace('</head>', link + '</head>')
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-favicon-once.yml
          git add index.html
          git commit -m "Link Techniques favicon"
          git push
