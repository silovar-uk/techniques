name: Add sentence ending camera speed technique

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-sentence-ending-camera-speed.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add technique
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/techniques.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const id = 'control-narrative-camera-speed-with-sentence-endings';
          if (!data.some(item => item.id === id)) {
            data.unshift({
              id,
              number: 'T-009',
              title: '文末で小説の「カメラ速度」を変える',
              summary: '小説の文末表現を、単なる文法ではなく「読者のカメラをどう動かすか」として使い分ける。〜た、〜る、〜ていた、体言止めなどで、完了・現在・滞留・追尾・停止といったテンポや距離感を調整する。',
              category: '文章・表現',
              tags: ['小説', '文章', '文末', '文体', 'テンポ', 'カメラ感', '創作'],
              updated: '2026-08-21',
              quickAnswer: '文章に違和感があるときは、内容だけでなく文末を見る。「〜た」で一瞬を切る、「〜る／う」で現在進行の速さを出す、「〜ていた」で状態に留まる、体言止めで一枚絵として止める、など、文末を“カメラ速度”として調整してみる。',
              steps: [
                '違和感のある段落の文末だけを抜き出す。内容ではなく「〜た」「〜る」「〜ていた」などの終わり方を見る。',
                'その場面を、切り取る・リアルタイムで追う・留まる・観察する・停止する・接近する、のどれにしたいか決める。',
                '狙うカメラ感に合わせて文末を1〜2か所だけ変える。全部を同じ型に揃えない。',
                '段落全体を読み直し、テンポが速すぎる／遅すぎる箇所がないか確認する。',
                '文法上の正誤ではなく、視点距離・時間感覚・余韻が狙い通りかで判断する。'
              ],
              commands: [],
              explanation: [
                { term: '〜た', text: '例：振り返った。動作を完了・確定させ、一瞬を切り取る感覚。テンポは中程度。' },
                { term: '〜る／う', text: '例：振り返る。今そこで起きている感じが強く、リアルタイム感を出しやすい。テンポは速め。' },
                { term: '〜ていた', text: '例：笑っていた。動作そのものより状態を眺める。時間を少し長く取り、その場に留まる感覚。' },
                { term: '〜ている', text: '例：笑っている。現在の状態を映し続ける。観察するような距離感を作りやすい。' },
                { term: '〜だった', text: '例：静かな夜だった。状況や認識を確定させ、カメラを止めるような落ち着きが出る。' },
                { term: '〜だ', text: '例：静かな夜だ。強く断定し、語り手・主人公の主観を近づけやすい。' },
                { term: '体言止め', text: '例：静かな夜。説明を進めず、絵や印象だけを置く。一枚絵のように時間を止める。' },
                { term: '〜ていく', text: '例：遠ざかっていく。変化の過程を追尾する。やや時間を長く使う。' },
                { term: '〜てくる', text: '例：近づいてくる。主人公・読者側へ変化が迫ってくる感覚を作る。' },
                { term: '〜始める', text: '例：雨が降り始める。変化が起動する瞬間を見せ、場面を動かす。' },
                { term: '〜続ける', text: '例：雨が降り続ける。継続を強調し、時間を引き伸ばす。' }
              ],
              tips: [
                '戦闘やアクションでは速い文末が効きやすい一方、日常場面で連続すると「カメラが速すぎる」違和感になることがある。',
                '同じ文末を機械的に避けるのではなく、場面の時間感覚に合わせて選ぶ。',
                '体言止めは強い停止効果があるので、連発すると演出的になりすぎる。',
                'これは文法規則ではなく、文章のテンポと視点を調整するための創作上の比喩として使う。'
              ],
              sources: [
                {
                  label: 'X — @cb_storyteller「小説の文末・完全整理」',
                  url: 'https://x.com/cb_storyteller/status/2090394161438769592?s=46'
                }
              ],
              evidence: {
                level: 'PERSONAL',
                note: '引用元のX投稿で提示された創作上の整理を、実践用に再構成したもの。「文末＝カメラ速度」は有用な比喩だが、文法学上の絶対的な対応関係を示すものではない。'
              }
            });
          }
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Commit technique and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-sentence-ending-camera-speed.yml
          git add data/techniques.json
          git commit -m "Add sentence ending camera speed technique"
          git push
