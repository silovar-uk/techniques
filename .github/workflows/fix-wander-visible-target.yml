name: Fix Wander Visible Target

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-wander-visible-target.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep Wander on a visible target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          text = p.read_text()
          old = '''function revealRandomTechnique(id) {
            const row = [...document.querySelectorAll('[data-technique-id]')]
              .find(element => element.dataset.techniqueId === id);
            const item = techniques.find(entry => entry.id === id);
          '''
          new = '''function revealRandomTechnique(id) {
            const matchingTargets = [...document.querySelectorAll('[data-technique-id]')]
              .filter(element => element.dataset.techniqueId === id);
            const row = matchingTargets.find(element => !element.closest('[hidden]')) || matchingTargets[0];
            const item = techniques.find(entry => entry.id === id);
          '''
          if old not in text:
              raise SystemExit('revealRandomTechnique anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          node --check app.js
          node scripts/validate-techniques.mjs
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-wander-visible-target.yml
          git config user.name 'silovar-uk'
          git config user.email '46244124+silovar-uk@users.noreply.github.com'
          git add app.js .github/workflows/fix-wander-visible-target.yml
          git commit -m 'Keep Wander on visible field targets'
          git push
