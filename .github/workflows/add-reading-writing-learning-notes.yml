name: Add reading writing learning notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-reading-writing-learning-notes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add three thinking techniques
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/techniques.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const ids = new Set(data.map(x => x.id));

          const additions = [
            {
              id: 'reading-modes-picture-sound-structure',
              number: 'T-006',
              title: '拾い読みは絵、黙読は音、精読は構造として読む',
              summary: '読む速さの違いではなく、文章を何として知覚するかの違いとして読むモードを切り分ける。拾い読みは空間、黙読は時間、精読は関係を見る。',
              category: '思考・学習',
              tags: ['読書', '拾い読み', '黙読', '精読', '理解', '構造'],
              updated: '2026-08-19',
              quickAnswer: '文章が読みにくいときは、最初から最後まで同じ読み方を続けない。まず見出し・段落・数字・太字を「絵」として眺め、次に文の流れを「音」として通り、最後に主張・根拠・反論・結論の関係を「構造」として組み直す。',
              steps: [
                '最初にページ全体を眺め、見出し、段落の長短、数字、固有名詞などを拾う。',
                '次に前から後ろへ読み、文のリズムや接続詞に乗って意味の流れを追う。',
                '理解が止まる箇所では、主張・根拠・例・反論・結論の関係を書き出す。',
                '複雑な文章ほど、絵→音→構造を一方向に進むのではなく往復する。'
              ],
              commands: [],
              explanation: [
                { term: '拾い読み＝絵', text: '一語ずつではなく、紙面や画面の地形として情報のありかを探す。空間的な読み。' },
                { term: '黙読＝音', text: '文を前から後ろへ時間軸に沿って処理し、リズムやつながりの中で意味を受け取る。' },
                { term: '精読＝構造', text: '語句そのものより、主張と根拠、前提と結論、反論と応答などの関係を見る。' },
                { term: '読みづらさ', text: '難しい文章をずっと「音」として前から順番に処理すると保持しきれないことがある。読むモードを切り替えることで理解を助けられる。' }
              ],
              tips: [
                '「最初から全部ちゃんと読む」を読書の標準にしない。',
                '複雑な論考は、先に構造を取ってから本文へ戻ると読みやすい。',
                '拾い読みは雑な読みではなく、次にどこを深く読むか決める探索でもある。'
              ],
              sources: [],
              evidence: {
                level: 'PERSONAL',
                note: '読むモードを「絵・音・構造」として整理するための個人的な概念モデル。学術的分類そのものではなく、読解時の使い分けを思い出すための枠組み。'
              }
            },
            {
              id: 'ai-can-find-moving-material-not-moving-style',
              number: 'T-007',
              title: 'AIは心が動くネタを集められても、人が動く文体までは書けない',
              summary: 'AIは感情を動かしやすい材料や型を集められるが、文体には観察した時間、距離、照れ、何を書かないかまで混ざる。感動の条件と、人が動く文章は同じではない。',
              category: '思考・学習',
              tags: ['AI', '文章', '文体', 'ライティング', '感情', '余白'],
              updated: '2026-08-19',
              quickAnswer: 'AIに文章を書かせるときは「感動させる文」を直接頼むより、事実・観察・具体的なディテールを集めさせ、人間側が何を残し、何を書かないかを決める。文体は材料の選択だけでなく、書き手の履歴と省略から生まれる。',
              steps: [
                'まずAIには、人物、出来事、具体的な場面、発言など「材料」を集めさせる。',
                '「泣ける」「感動的」など感情語を足す前に、何が実際に起きたかを具体化する。',
                'その人を見ていた時間や距離感が出るディテールを人間側で選ぶ。',
                '説明しすぎている一文を探し、読者が感じ取れる部分は削る。',
                '最後に「この言い方を、この書き手が選ぶ理由があるか」を確認する。'
              ],
              commands: [],
              explanation: [
                { term: '材料と文体', text: 'AIは人が反応しやすい題材や構成を大量に知っている。一方、文体はそれらを並べる技術だけでは決まらない。' },
                { term: '観察した時間', text: '強い文章には、書き手が対象をどう見ていたかという時間の蓄積が具体的な一言に圧縮されることがある。' },
                { term: '何を書かないか', text: '意味をすべて説明せず、読者が自分で感情を入れられる余白を残すことが文章の強さになる。' },
                { term: '文章の外側', text: '同じ文でも、誰が、いつ、何を背負って言ったかで受け取られ方は変わる。文体は文字列だけには閉じていない。' }
              ],
              tips: [
                'AIには「感動する表現」を書かせるより、「具体的な観察」を増やさせる方が使いやすい。',
                '「震える手」「静かに涙」など、感情を直接示す定型表現が増えたら一度削る。',
                '文章を強くしたいときは、足すより最後の説明を1文消す方が効く場合がある。'
              ],
              sources: [],
              evidence: {
                level: 'PERSONAL',
                note: 'AI生成文と人間の文体の違いを考えるための個人的な作業仮説。AIが原理的に文体を書けないという科学的断定ではなく、実務上の文章設計ルールとして保存する。'
              }
            },
            {
              id: 'reading-aloud-is-not-understanding-or-speaking',
              number: 'T-008',
              title: '音読できることと、理解して話せることを分ける',
              summary: '音読は主に文字列を音へ変換する処理。理解は文字・音から意味を取り出し、会話は意味や意図から自分で言葉を組み立てる。口から英語が出る点は同じでも処理の向きが違う。',
              category: '思考・学習',
              tags: ['英語', '音読', '理解', '会話', '発話', '学習法'],
              updated: '2026-08-19',
              quickAnswer: '音読がスムーズでも、それだけで「理解した」「自分で話せる」と判断しない。音読後に英文を隠し、内容を自分の言葉で説明・再現できるかを確認する。',
              steps: [
                '英文を音読し、発音やリズムを確認する。',
                '英文を見ずに、何を言っていたか日本語または簡単な英語で説明する。',
                '元の英文を隠したまま、同じ意味を自分ならどう言うか英語で作る。',
                '出てこない表現だけ元文に戻り、意味と表現の対応を確認する。',
                'もう一度、意味から英文を作る。音読→理解→発話を別々に確認する。'
              ],
              commands: [],
              explanation: [
                { term: '音読', text: '目の前にある文字列を音列へ変換する。次に何を言うかは英文側が決めてくれている。' },
                { term: '理解', text: '文字や音を、出来事・意図・関係などの意味として頭の中に立ち上げる。' },
                { term: '会話', text: '最初にあるのは言いたい意味や意図で、そこから語彙・文法・語順を選び、自分で英文を組み立てる。' },
                { term: '処理の向き', text: '音読は英文→音、会話は意味→英文→音。どちらも発声を伴うが、必要な処理は同じではない。' }
              ],
              tips: [
                '音読の評価を「噛まずに読めた」だけで終わらせない。',
                '英文を隠して内容を言い直す工程を入れると、理解と発話の穴が見えやすい。',
                '音読は不要なのではなく、理解や発話とは別の層として使う。',
                '「意味から英文を出す」練習を別に持つ。'
              ],
              sources: [],
              evidence: {
                level: 'PERSONAL',
                note: '音読・理解・発話を学習上別々に点検するための実践モデル。各過程は認知的に重なる部分もあるため、完全に独立した能力という意味ではない。'
              }
            }
          ];

          for (const item of additions.slice().reverse()) {
            if (!ids.has(item.id)) data.unshift(item);
          }

          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-reading-writing-learning-notes.yml
          git add data/techniques.json
          git commit -m "Add reading writing and speaking thinking notes"
          git push
