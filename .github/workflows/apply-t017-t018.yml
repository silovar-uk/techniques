name: Apply T017 T018

on:
  push:
    paths:
      - '.github/workflows/apply-t017-t018.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Add techniques
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          main_path = Path('data/techniques.json')
          pending_path = Path('data/pending-t017-t018.json')

          techniques = json.loads(main_path.read_text())
          pending = json.loads(pending_path.read_text())

          existing_ids = {item['id'] for item in techniques}
          existing_numbers = {item['number'] for item in techniques}
          for item in pending:
              if item['id'] in existing_ids:
                  raise SystemExit(f"duplicate id: {item['id']}")
              if item['number'] in existing_numbers:
                  raise SystemExit(f"duplicate number: {item['number']}")

          techniques = pending + techniques
          main_path.write_text(json.dumps(techniques, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Validate
        run: |
          node --check app.js
          node scripts/validate-techniques.mjs
          python - <<'PY'
          import json
          data = json.load(open('data/techniques.json'))
          assert data[0]['number'] == 'T-017'
          assert data[1]['number'] == 'T-018'
          assert data[0]['evidence']['level'] == 'SUPPORTED'
          assert data[1]['evidence']['level'] == 'VERIFIED'
          print('T-017 and T-018 validated')
          PY

      - name: Commit and clean up
        run: |
          rm data/pending-t017-t018.json
          rm .github/workflows/apply-t017-t018.yml
          git config user.name "silovar-uk"
          git config user.email "46244124+silovar-uk@users.noreply.github.com"
          git add -A
          git commit -m "Add UI sketch and M3E Canvas techniques"
          git push
