name: Apply FxTwitter Technique

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-fxtwitter-technique.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Add T-014 FxTwitter technique
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          path = Path('data/techniques.json')
          data = json.loads(path.read_text())

          if any(item.get('number') == 'T-014' or item.get('id') == 'read-x-articles-with-fxtwitter-api' for item in data):
              raise SystemExit('T-014 or target id already exists')

          technique = {
            "id": "read-x-articles-with-fxtwitter-api",
            "number": "T-014",
            "title": "Xの記事本文をFxTwitter APIで読む",
            "summary": "XのArticleや長文投稿を直接取得しにくいときは、元投稿のURLをFxTwitter APIのURLへ置き換えると、公開投稿のJSONを取得できる。Article対応投稿では記事データも含まれるため、本文を読む・保存する・AIへ渡す入口として使える。",
            "category": "PC・スマホ",
            "tags": ["X", "Twitter", "FxTwitter", "FxEmbed", "API", "記事", "Article", "長文", "URL", "JSON"],
            "updated": "2026-08-31",
            "quickAnswer": "X Articleの元になっている投稿URLが https://x.com/USER/status/POST_ID なら、https://api.fxtwitter.com/USER/status/POST_ID に置き換えて開く。FxTwitter APIはJSONを返し、Article対応投稿では記事データも含まれる。単に x.com を fixupx.com に変える方法は主に埋め込み改善用で、通常のブラウザでは元のXへ戻る場合があるため、本文を取り出して読む目的ならAPIを使う方が分かりやすい。",
            "steps": [
              "読みたいX Articleの元投稿URLを確認する。できれば https://x.com/USER/status/POST_ID 形式の投稿パーマリンクを使う。",
              "URLの x.com を api.fxtwitter.com に置き換え、https://api.fxtwitter.com/USER/status/POST_ID の形にする。",
              "変更したURLを開く。返ってきたJSONの投稿データを確認し、Article付きの投稿なら article データからタイトルや本文などを読む。",
              "手元に https://x.com/i/article/... だけがある場合は、まずそのArticleを告知している元のstatus URLを探す。Article IDと投稿IDは同じ名前空間ではないため、i/articleの数字をそのままstatus IDとして使わない。"
            ],
            "commands": [
              {
                "label": "X投稿URL → FxTwitter API",
                "code": "https://api.fxtwitter.com/USER/status/POST_ID",
                "note": "元URLが https://x.com/USER/status/POST_ID なら、ユーザー名とPOST_IDをそのまま使う。"
              }
            ],
            "explanation": [
              {
                "term": "fixupx.comとの違い",
                "text": "fixupx.com / fxtwitter.com はDiscordやTelegramなどのリンク埋め込みを改善する用途が中心。通常ブラウザからのアクセスは元のXへリダイレクトする設計がある。一方、api.fxtwitter.com はX/TwitterデータをJSONとして取得する公開API。"
              },
              {
                "term": "X Articlesにも対応",
                "text": "FxEmbedの現行実装にはArticleデータを扱う構造があり、Instant View側でもArticleのタイトル、本文、カバー画像やインラインメディアをレンダリングする処理がある。"
              },
              {
                "term": "i/article URLだけでは足りないことがある",
                "text": "X ArticleのIDと通常投稿のstatus IDは別の名前空間。FxTwitter APIへ渡すときは、Articleを共有している元の投稿パーマリンクを使うのが分かりやすい。"
              },
              {
                "term": "APIの世代",
                "text": "FxEmbedの現在のAPIドキュメントではv2が現行で、旧来の /USER/status/ID 形式も後方互換として動作するとされている。短く覚えるTechniqueではこの従来形式を入口として使う。"
              }
            ],
            "tips": [
              "公開投稿でも、削除・非公開・年齢や地域などの制限、X側やFxEmbed側の仕様変更によって取得できない場合がある。",
              "「Xへログインせず何でも読める」「制限を必ず回避できる」とは考えない。取得できる範囲は投稿状態と外部サービスの仕様に依存する。",
              "単に共有カードを見やすくしたいだけなら x.com → fixupx.com で十分。本文をJSONとして読みたいときだけ api.fxtwitter.com を使う。",
              "テキストだけの埋め込みには t.fixupx.com / t.fxtwitter.com という派生もあるが、これはAPI JSON取得とは別用途。"
            ],
            "sources": [
              {
                "label": "FxEmbed — API Overview",
                "url": "https://docs.fxembed.com/api/introduction/"
              },
              {
                "label": "FxEmbed — Getting Started",
                "url": "https://docs.fxembed.com/guide/getting-started/"
              },
              {
                "label": "FxEmbed — Instant View source",
                "url": "https://github.com/FxEmbed/FxEmbed/blob/main/src/render/instantview.ts"
              },
              {
                "label": "FxEmbed — GitHub",
                "url": "https://github.com/FxEmbed/FxEmbed"
              }
            ],
            "evidence": {
              "level": "SUPPORTED",
              "note": "FxEmbedの現行公式ドキュメントで公開FxTwitter APIと後方互換のstatus URL形式を確認し、公式ソースコードでX Article本文・カバー画像・インラインメディアを扱う実装を確認した。実際の取得可否は投稿状態やX/FxEmbed側の仕様変更に依存するためSUPPORTEDとする。"
            }
          }

          data.insert(0, technique)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Validate technique data
        run: node scripts/validate-techniques.mjs

      - name: Commit data and remove temporary workflow
        run: |
          rm .github/workflows/apply-fxtwitter-technique.yml
          git config user.name "silovar-uk"
          git config user.email "46244124+silovar-uk@users.noreply.github.com"
          git add data/techniques.json .github/workflows/apply-fxtwitter-technique.yml
          git commit -m "Add FxTwitter X article reading technique"
          git push
