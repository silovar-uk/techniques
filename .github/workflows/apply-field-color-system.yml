name: Apply Field Color System

on:
  push:
    paths:
      - '.github/workflows/apply-field-color-system.yml'
      - '.github/apply_field_colors.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply field colors
        run: python .github/apply_field_colors.py
      - name: Validate
        run: |
          node --check app.js
          node scripts/validate-techniques.mjs
      - name: Commit and clean up
        run: |
          rm .github/workflows/apply-field-color-system.yml .github/apply_field_colors.py
          git config user.name "silovar-uk"
          git config user.email "46244124+silovar-uk@users.noreply.github.com"
          git add app.js styles.css index.html .github/workflows/apply-field-color-system.yml .github/apply_field_colors.py
          git commit -m "Give Techniques a playful field palette"
          git push
