name: Apply State Rich Writing Technique

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-state-rich-writing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Add T-015 state-rich writing technique
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          path = Path('data/techniques.json')
          data = json.loads(path.read_text())

          item = {
            "id": "write-private-notes-with-emotional-state",
            "number": "T-015",
            "title": "私的な文章では、そのときの自分の状態まで書き残す",
            "summary": "日記や個人メモは、出来事だけでなく感情・強度・欲求・迷い・予想・変化まで残すと、未来の自分が当時の状態を再構成しやすい。副詞・形容詞・助動詞的な表現は、文章を飾るためではなく主観を保存するために使う。",
            "category": "文章・表現",
            "tags": ["文章", "日記", "メモ", "記憶", "感情", "自伝的記憶", "副詞", "形容詞", "助動詞", "振り返り"],
            "updated": "2026-08-31",
            "quickAnswer": "公的な文章では、事実・共有可能性・誤解の少なさを優先し、個人的な感情修飾は必要な範囲に抑える。一方、日記や個人メモでは、感情を削りすぎない。『何があったか』だけでなく、『どのくらい？』『どう感じた？』『本当はどうしたかった？』『何が起こると思っていた？』『途中でどう変わった？』まで残す。『かなり』『なんとなく』『思ったより』『もう少し』などの副詞、感情を表す形容表現、そして『〜したかった』『〜かもしれない』『〜な気がした』『〜すればよかった』のような助動詞的・モダリティ表現は、当時の主観を保存する手掛かりとして積極的に残す。",
            "steps": [
              "まず、その文章が公的なものか私的なものかを判断する。公的文章では事実と共有可能性を優先し、個人的な感情表現は目的に必要な分だけ使う。",
              "私的文章では、出来事の事実に加えて『どう感じたか』と『どのくらい強く感じたか』を残す。『楽しかった』だけでなく『思ったよりかなり楽しかった』のように程度も書く。",
              "欲求・迷い・予想・後悔も残す。『もう少し一緒にいたかった』『楽しめるかなと少し不安だった』『こうなるかもしれないと思った』のような表現を、冗長だからという理由だけで削らない。",
              "感情の変化を書く。『会う前は不安だったのに、話し始めると安心して、最後にはまだ帰りたくなかった』のように、最初と最後の差を残すと経験の流れが再現しやすい。",
              "後から文章を整えるときも、当時の自分の声を消しすぎない。『すごく』『なんとなく』『やっぱり』などを、意味があるならそのまま残す。"
            ],
            "commands": [],
            "explanation": [
              {
                "term": "PUBLIC / PRIVATE SWITCH",
                "text": "公的文章と私的文章では目的が違う。公的文章は他者が同じ意味で読めることを優先する。一方、私的文章は未来の自分が当時の経験を再構成できることにも価値があるため、重要な主観を削らない。"
              },
              {
                "term": "STATE-RICH WRITING",
                "text": "保存したいのは品詞の数ではなく、そのときの内面状態。FEELING（感情）、INTENSITY（強度）、DESIRE（欲求）、EXPECTATION（予想）、UNCERTAINTY（迷い）、CHANGE（変化）を必要な範囲で残す。"
              },
              {
                "term": "副詞・形容詞・助動詞的表現",
                "text": "『かなり』『妙に』『ちょっと』『思ったより』のような副詞、『嬉しい』『寂しい』『不安』のような評価語、『〜したかった』『〜かもしれない』『〜な気がした』のようなモダリティ表現は、当時の感情の強度・方向・確信度を保存する道具として使える。"
              },
              {
                "term": "感情の軌跡",
                "text": "静止画のような感情ラベルだけでなく、時間の中でどう変わったかを残す。『最初は不安→途中で安心→最後は帰りたくない』のような変化は、その日の経験をより立体的に思い出す手掛かりになる。"
              },
              {
                "term": "研究と実践を分ける",
                "text": "感情と自伝的記憶の関連、感情語を含む自伝的ナラティブと自己参照記憶の関連には研究上の支持がある。一方、『副詞や形容詞を多く使うほど記憶が良くなる』ことを直接示した研究ではないため、品詞の活用は実践上の提案として扱う。"
              }
            ],
            "tips": [
              "私的文章でも、同じ意味の『すごく・とても・本当に・かなり』を全部重ねる必要はない。削ると当時の状態が失われる言葉だけ残す。",
              "『2時間話した』のような事実だけで終えず、『気づいたら2時間話していて、思ったよりずっと自然で楽しかった』まで書くと、その日の自分が残りやすい。",
              "公的文章でも謝罪・挨拶・広報などでは温度感が必要な場合がある。PUBLIC＝無感情ではなく、個人的な主観を目的に合わせて制御するという意味。",
              "感情語だけでなく、場所・匂い・音・身体感覚・相手の表情・印象に残った一言なども、思い出すスイッチになりそうなら短く残す。",
              "感情の言語化には感情調整との関連も研究されているが、効果は状況やタイミングによって一様ではない。『書けば必ず気分が良くなる』とは考えない。"
            ],
            "sources": [
              {
                "label": "Emotion and Autobiographical Memory — Cognition and Emotion review",
                "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC2852439/"
              },
              {
                "label": "The influence of emotional narrative content on the self-reference effect in memory",
                "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC9997179/"
              },
              {
                "label": "Subjective Responses to Emotional Stimuli During Labeling, Reappraisal, and Distraction",
                "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3444304/"
              },
              {
                "label": "Affect labeling: The role of timing and intensity",
                "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC9799301/"
              }
            ],
            "evidence": {
              "level": "SUPPORTED",
              "note": "感情と自伝的記憶の関係、感情語を含む自伝的ナラティブと自己参照記憶の関連には研究上の支持がある。一方、副詞・形容詞・助動詞的表現を多く使うこと自体が記憶を改善すると直接検証されたわけではないため、内面状態を保存するための実践的な文章術としてSUPPORTEDとする。"
            }
          }

          if any(x.get('number') == 'T-015' or x.get('id') == item['id'] for x in data):
              raise SystemExit('T-015 or id already exists')

          data.insert(0, item)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Validate technique data
        run: node scripts/validate-techniques.mjs

      - name: Commit data and remove temporary workflow
        run: |
          rm .github/workflows/apply-state-rich-writing.yml
          git config user.name "silovar-uk"
          git config user.email "46244124+silovar-uk@users.noreply.github.com"
          git add data/techniques.json .github/workflows/apply-state-rich-writing.yml
          git commit -m "Add state-rich private writing technique"
          git push
