name: Validate Techniques and Shortcut UX

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techniques-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate technique data
        run: node scripts/validate-techniques.mjs
      - name: Validate shortcut UX logic
        run: |
          node --check prompt-shortcuts.js
          node --check prompt-transforms.js
          node --check app.js
          node scripts/check-prompt-shortcuts.mjs
