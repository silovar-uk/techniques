name: Add prompt expansion technique

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-prompt-expansion-technique.yml'

permissions:
  contents: write

jobs:
  add-technique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add technique
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/techniques.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const entry = {
            id: 'expand-short-keywords-into-ai-prompts',
            number: 'T-012',
            title: '短い合言葉で、長いAIプロンプトをすぐ呼び出す',
            summary: 'よく使う長い指示文を、日本語の短いトリガーに割り当てておく。手元の環境では「ぷろせけ」でプロンプト設計・批評用の定型文、「めたぷろ」でメタプロンプト作成依頼を展開する。',
            category: '思考・学習',
            tags: ['AI','プロンプト','メタプロンプト','定型文','テキスト展開','キーボード','入力効率化','ショートカット'],
            updated: '2026-08-23',
            quickAnswer: '長いプロンプトを毎回打たず、短い日本語トリガーで展開する。現在は「ぷろせけ」→プロンプト設計・批評用の詳細指示、「めたぷろ」→「メタ的に、次に何をすべきか、構造的にまとめたプロンプトを作って。」を呼び出す。',
            steps: [
              'よく使う長い指示文のうち、毎回ほぼ同じ内容を使うものを選ぶ。',
              '覚えやすく、普通の文章では誤入力しにくい短い日本語トリガーを決める。',
              '日本語入力のユーザー辞書やテキスト展開機能など、自分の入力環境にトリガーと展開文を登録する。',
              '用途の違う定型文には別のトリガーを割り当てる。「ぷろせけ」はプロンプトそのものを改善したいとき、「めたぷろ」は次の実行指示を構造化したいときに使う。',
              '定型文を更新したら、展開側も修正して、古い指示が残らないようにする。'
            ],
            commands: [
              {
                label: 'ぷろせけ',
                code: 'あなたはプロンプト設計者兼、批判的なレビュー担当者。  与えられたプロンプトを、そのまま言い換えるのではなく「より良い結果を再現できる制作構造」に改善する。  次の順で考える。  1. 目的・対象・最終成果物を特定 2. 曖昧語を具体的な条件・変数へ分解 3. 不足・矛盾・過剰な指示を指摘 4. 制作と監査を分離 5. 却下条件・品質基準を追加 6. 実行順序を明確化  出力は必ず複数のテキストブロックに分ける。  【現状分析】 問題点だけ簡潔に。  【改善方針】 何をどう変えるか。  【改善後プロンプト】 そのままコピペできる完成版。  【追加改善案】 さらに精度を上げるなら何を加えるか。',
                note: 'プロンプト自体を批判的に点検し、再現性のある制作構造へ改善したいときに使う。'
              },
              {
                label: 'めたぷろ',
                code: 'メタ的に、次に何をすべきか、構造的にまとめたプロンプトを作って。',
                note: '次のアクションを自分で考える前に、AIへ実行用の指示書を組み立てさせたいときに使う。'
              }
            ],
            explanation: [
              {term:'短いトリガー', text:'数文字の合言葉を入力すると、登録しておいた長文へ展開する。長い定型文を毎回再入力するコストと、書きぶれを減らせる。'},
              {term:'用途で分ける', text:'「ぷろせけ」は既存プロンプトの設計・監査、「めたぷろ」は次に使う実行プロンプトの生成というように、役割を分けると呼び出し時に迷いにくい。'},
              {term:'定型化の効用', text:'よく使う指示を固定すると、毎回の表現差よりも、本当に変えるべき目的・対象・制約へ意識を使える。'}
            ],
            tips: [
              '普通の日本語文章で偶然入力しにくい読みを選ぶ。',
              '長文側は一か所だけを正本にして、似たバージョンを増やしすぎない。',
              'プロンプトの目的が変わったら、トリガー名も分ける。ひとつの定型文に役割を詰め込みすぎない。',
              '登録方法はOS・IME・テキスト展開ツールによって違うため、自分の入力環境に合う方法を使う。'
            ],
            sources: [],
            evidence: {
              level: 'PERSONAL',
              note: '本人の入力環境で実際に使っている定型文展開ルールを、再利用できるTechniqueとして保存したもの。'
            }
          };
          const idx = data.findIndex(x => x && x.id === entry.id);
          if (idx >= 0) data[idx] = {...data[idx], ...entry};
          else data.unshift(entry);
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-prompt-expansion-technique.yml
          git add data/techniques.json
          git commit -m "Add prompt expansion technique"
          git push
