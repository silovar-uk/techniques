name: Apply Two Word Compression Technique

on:
  push:
    paths:
      - '.github/workflows/apply-two-word-compression.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Add technique
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          main_path = Path('data/techniques.json')
          pending_path = Path('data/pending-two-word-compression.json')

          techniques = json.loads(main_path.read_text())
          item = json.loads(pending_path.read_text())

          existing_ids = {x.get('id') for x in techniques}
          if item['id'] in existing_ids:
              raise SystemExit(f"duplicate id: {item['id']}")

          numbers = []
          for x in techniques:
              m = re.fullmatch(r'T-(\d+)', str(x.get('number','')))
              if m:
                  numbers.append(int(m.group(1)))

          next_number = max(numbers, default=0) + 1
          item['number'] = f"T-{next_number:03d}"

          techniques = [item] + techniques
          main_path.write_text(json.dumps(techniques, ensure_ascii=False, indent=2) + '\n')
          print(f"Added {item['number']}: {item['title']}")
          PY

      - name: Validate
        run: |
          node --check app.js
          node scripts/validate-techniques.mjs
          python - <<'PY'
          import json
          data = json.load(open('data/techniques.json'))
          item = data[0]
          assert item['id'] == 'compress-list-items-to-two-word-index'
          assert item['evidence']['level'] == 'SUPPORTED'
          assert item['number'].startswith('T-')
          print(item['number'], item['title'])
          PY

      - name: Commit and clean up
        run: |
          rm data/pending-two-word-compression.json
          rm .github/workflows/apply-two-word-compression.yml
          git config user.name "silovar-uk"
          git config user.email "46244124+silovar-uk@users.noreply.github.com"
          git add -A
          git commit -m "Add two-word compression technique"
          git push
