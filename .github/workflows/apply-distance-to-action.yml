name: Apply Distance to Action improvements

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-distance-to-action.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply lightweight retrieval improvements
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          app_path = Path('app.js')
          app = app_path.read_text()

          old_filter = '''function getFilteredItems() {
            const query = normalize(searchQuery.trim());
            return techniques.filter(item => {
              const categoryMatch = activeCategory === 'すべて' || item.category === activeCategory;
              const queryMatch = !query || searchableText(item).includes(query);
              return categoryMatch && queryMatch;
            });
          }
          '''
          new_filter = '''function getSearchScore(item, query) {
            const tokens = query.split(/\\s+/).filter(Boolean);
            if (!tokens.length) return 0;
            const fullText = searchableText(item);
            if (!tokens.every(token => fullText.includes(token))) return -1;

            const title = normalize(item.title);
            const tags = normalize((item.tags || []).join(' '));
            const category = normalize(item.category);
            const summary = normalize(item.summary);
            const quickAnswer = normalize(item.quickAnswer);
            let score = title.includes(query) ? 80 : 0;

            tokens.forEach(token => {
              if (title.includes(token)) score += 32;
              if (tags.includes(token)) score += 20;
              if (category.includes(token)) score += 14;
              if (summary.includes(token)) score += 10;
              if (quickAnswer.includes(token)) score += 8;
            });
            return score;
          }

          function getFilteredItems() {
            const query = normalize(searchQuery.trim());
            return techniques
              .map((item, index) => ({ item, index, score: query ? getSearchScore(item, query) : 0 }))
              .filter(({ item, score }) => {
                const categoryMatch = activeCategory === 'すべて' || item.category === activeCategory;
                return categoryMatch && score >= 0;
              })
              .sort((a, b) => query ? b.score - a.score || a.index - b.index : a.index - b.index)
              .map(({ item }) => item);
          }
          '''
          app = replace_once(app, old_filter, new_filter, 'replace search filter with tokenized relevance search')

          old_bind = '''function bindHomeEvents() {
            const input = document.querySelector('#search');
            input?.addEventListener('input', event => {
              searchQuery = event.target.value;
              updateLibrary();
            });
            input?.addEventListener('focus', () => {
              const readout = document.querySelector('#searchReadout');
              if (readout && !searchQuery.trim()) readout.textContent = `SEARCH ${getFilteredItems().length} RECORDS`;
            });
            input?.addEventListener('blur', () => updateSearchReadout(getFilteredItems(), false));
            document.querySelectorAll('[data-category]').forEach(button => {
              button.addEventListener('click', event => {
                activeCategory = button.dataset.category;
                updateLibrary();
                event.currentTarget.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'auto' });
              });
            });
          }
          '''
          new_bind = '''function getResultRows() {
            return [...document.querySelectorAll('#libraryResults .technique-row')];
          }

          function focusResultRow(row) {
            if (!row) return;
            row.focus({ preventScroll: true });
            row.scrollIntoView({ block: 'nearest', behavior: 'auto' });
          }

          function bindHomeEvents() {
            const input = document.querySelector('#search');
            const results = document.querySelector('#libraryResults');

            input?.addEventListener('input', event => {
              searchQuery = event.target.value;
              updateLibrary();
            });
            input?.addEventListener('focus', () => {
              const readout = document.querySelector('#searchReadout');
              if (readout && !searchQuery.trim()) readout.textContent = `SEARCH ${getFilteredItems().length} RECORDS`;
            });
            input?.addEventListener('blur', () => updateSearchReadout(getFilteredItems(), false));
            input?.addEventListener('keydown', event => {
              if (event.isComposing) return;
              const rows = getResultRows();
              if (event.key === 'ArrowDown' && rows.length) {
                event.preventDefault();
                focusResultRow(rows[0]);
              }
              if (event.key === 'Enter' && rows.length === 1) {
                event.preventDefault();
                rows[0].click();
              }
            });

            results?.addEventListener('keydown', event => {
              if (event.isComposing || !['ArrowUp', 'ArrowDown'].includes(event.key)) return;
              const row = event.target.closest('.technique-row');
              if (!row) return;
              const rows = getResultRows();
              const index = rows.indexOf(row);
              if (index < 0) return;
              event.preventDefault();
              if (event.key === 'ArrowUp' && index === 0) {
                input?.focus({ preventScroll: true });
                return;
              }
              const nextIndex = event.key === 'ArrowDown'
                ? Math.min(index + 1, rows.length - 1)
                : Math.max(index - 1, 0);
              focusResultRow(rows[nextIndex]);
            });

            document.querySelectorAll('[data-category]').forEach(button => {
              button.addEventListener('click', event => {
                activeCategory = button.dataset.category;
                updateLibrary();
                event.currentTarget.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'auto' });
              });
            });
          }
          '''
          app = replace_once(app, old_bind, new_bind, 'add keyboard result navigation')

          app = replace_once(
              app,
              'value="${escapeHtml(searchQuery)}" aria-label="やり方を検索">',
              'value="${escapeHtml(searchQuery)}" aria-label="やり方を検索"\n          aria-controls="libraryResults" aria-keyshortcuts="ArrowDown">',
              'describe search keyboard relationship'
          )
          app_path.write_text(app)

          index_path = Path('index.html')
          index = index_path.read_text()
          index = replace_once(index, 'app.js?v=20260828-instrument1', 'app.js?v=20260828-distance1', 'bump app cache version')
          index_path.write_text(index)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          anchor = '- UI変更は Retrieval Speed / Scan Efficiency / Action Readiness の改善理由を説明できるものだけ採用する\n'
          addition = '''- 検索は複数語を空白で組み合わせられ、title / tags / category / summary / Quick Answerの近さで軽く並べ替える
          - keyboardでは `/` → 入力 → `↓` → `↑↓` → `Enter` で検索からTechniqueを開ける。検索結果が1件だけなら入力欄の `Enter` から直接開ける
          - 検索改善は新しいUI・dependency・network requestを増やさず、既存JSONだけで成立させる
          '''
          if addition.strip() not in readme:
              readme = replace_once(readme, anchor, anchor + addition, 'document distance-to-action rules')
          readme_path.write_text(readme)
          PY

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Validate technique data
        run: node scripts/validate-techniques.mjs

      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/apply-distance-to-action.yml
          git config user.name "silovar-uk"
          git config user.email "46244124+silovar-uk@users.noreply.github.com"
          git add app.js index.html README.md .github/workflows/apply-distance-to-action.yml
          git commit -m "Shorten distance from search to action"
          git push
