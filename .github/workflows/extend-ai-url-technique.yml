name: Extend AI URL technique

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extend-ai-url-technique.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extend technique
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/techniques.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const item = data.find(x => x.id === 'send-data-to-chatgpt-with-url-prompt');
          if (!item) throw new Error('target technique not found');

          item.title = 'URLやボタンからAIにデータを渡す';
          item.summary = 'Webページ上の文章やJSONを、ChatGPT・Claude・Gemini・Perplexityなどへ持っていく導線を作る。URLへ直接埋め込める場合はURLエンコードし、公式なprefill URLがない場合は「コピーしてAIを開く」方式にすると壊れにくい。';
          item.tags = Array.from(new Set([...(item.tags || []), 'Claude', 'Gemini', 'Perplexity', 'AI連携', 'clipboard']));
          item.updated = '2026-08-19';
          item.quickAnswer = '短いデータはURLエンコードしてAIへ渡せる。ChatGPTでは `https://chatgpt.com/?prompt=...` のような形が使える場合があるが公開仕様ではない。ClaudeやGeminiのWeb版では、外部サイトから任意のプロンプトをURLだけでprefillする公式仕様は確認できないため、`navigator.clipboard.writeText(prompt)` でコピーしてAIを開く方式が安全。Perplexityの `search?q=` 形式もWebフロントの正式APIとしては保証されないため、壊れたらコピー方式へ戻す。';

          const commands = item.commands || [];
          const labels = new Set(commands.map(c => c.label));
          const additions = [
            {
              label: 'ChatGPT版（URLへ埋め込む）',
              code: 'const prompt = `以下を整理して。\\n\\n${text}`;\nwindow.open(`https://chatgpt.com/?prompt=${encodeURIComponent(prompt)}`, "_blank", "noopener,noreferrer");',
              note: '`?prompt=` は便利だが、OpenAIの公開Helpで正式な外部連携仕様として案内されているものではない。仕様変更に備える。'
            },
            {
              label: 'Claude版（コピーして開く）',
              code: 'const prompt = `以下を整理して。\\n\\n${text}`;\nawait navigator.clipboard.writeText(prompt);\nwindow.open("https://claude.ai/", "_blank", "noopener,noreferrer");',
              note: 'ClaudeのWeb版で任意プロンプトをURLだけでprefillする公式仕様は確認できないため、コピー→Claudeを開く形が堅い。'
            },
            {
              label: 'Gemini版（コピーして開く）',
              code: 'const prompt = `以下を整理して。\\n\\n${text}`;\nawait navigator.clipboard.writeText(prompt);\nwindow.open("https://gemini.google.com/app", "_blank", "noopener,noreferrer");',
              note: 'GeminiのWeb版も、外部サイトからプロンプト本文をURLへ埋め込む正式仕様は確認できない。コピー方式ならUI変更の影響を受けにくい。'
            },
            {
              label: 'Perplexity版（URLへ渡す・非公式扱い）',
              code: 'const prompt = `以下を調べて。\\n\\n${text}`;\nwindow.open(`https://www.perplexity.ai/search?q=${encodeURIComponent(prompt)}`, "_blank", "noopener,noreferrer");',
              note: 'Perplexityは質問文をそのまま検索・プロンプトとして扱えるが、`/search?q=` をWeb連携用の正式仕様として保証する公式ドキュメントは確認できない。動かなければコピー方式へ。'
            },
            {
              label: '複数AI対応の共通関数',
              code: 'async function openInAI(provider, prompt) {\n  const encoded = encodeURIComponent(prompt);\n  const directUrls = {\n    chatgpt: `https://chatgpt.com/?prompt=${encoded}`,\n    perplexity: `https://www.perplexity.ai/search?q=${encoded}`\n  };\n  if (directUrls[provider]) {\n    window.open(directUrls[provider], "_blank", "noopener,noreferrer");\n    return;\n  }\n  const homeUrls = {\n    claude: "https://claude.ai/",\n    gemini: "https://gemini.google.com/app"\n  };\n  await navigator.clipboard.writeText(prompt);\n  window.open(homeUrls[provider], "_blank", "noopener,noreferrer");\n}',
              note: 'URL直渡しできるものと、コピー→起動のものを1つの関数で吸収する形。実サービスでは「プロンプトをコピー」ボタンも別に置くとさらに壊れにくい。'
            }
          ];
          for (const addition of additions) {
            if (!labels.has(addition.label)) commands.push(addition);
          }
          item.commands = commands;

          item.explanation = item.explanation || [];
          const terms = new Set(item.explanation.map(x => x.term));
          const explanations = [
            {
              term: 'AIごとにURL連携の扱いが違う',
              text: 'Web版AIは、検索サービスのようにクエリパラメータを公開仕様として提供しているとは限らない。ChatGPTやPerplexityで動くURL形式があっても、外部連携APIと同じ安定性は期待しない。ClaudeやGeminiでは、コピーしてWebアプリを開く方式を基本にすると保守しやすい。'
            },
            {
              term: 'コピー → AIを開く方式',
              text: '`navigator.clipboard.writeText(prompt)` で本文をクリップボードへ入れ、対象AIのトップ画面を新しいタブで開く。1回貼り付ける操作は残るが、URL仕様変更に強く、複数AIへ横展開しやすい。'
            },
            {
              term: '本格連携は各社API',
              text: '結果を自動取得したい、大量処理したい、ファイルを安全に渡したい場合は、ChatGPTのショートカットURLではなくOpenAI API、Anthropic API、Gemini API、Perplexity APIなど各社の正式APIを使う。'
            }
          ];
          for (const row of explanations) {
            if (!terms.has(row.term)) item.explanation.push(row);
          }

          item.tips = Array.from(new Set([
            ...(item.tips || []),
            '「ChatGPTに聞く」「Claudeに聞く」「Geminiに聞く」「Perplexityで調べる」のように複数ボタンを並べると、同じデータを目的別に投げ分けられる。',
            'Claude・Geminiは、プロンプトをクリップボードへコピーしてからAIを開く方式を標準にすると壊れにくい。',
            'Perplexityは調査・出典確認、Claudeは長文整理、GeminiはGoogle系との相性、ChatGPTは汎用処理、のようにボタン名自体へ用途を入れてもよい。',
            'URL直渡しが突然動かなくなることを前提に、必ず「プロンプトをコピー」だけの退避導線を残す。'
          ]));

          item.sources = item.sources || [];
          const urls = new Set(item.sources.map(x => x.url));
          const sources = [
            { label: 'Anthropic Docs — Intro to Claude', url: 'https://docs.anthropic.com/en/docs/welcome' },
            { label: 'Google AI for Developers — Gemini API', url: 'https://ai.google.dev/gemini-api/docs' },
            { label: 'Perplexity Help — プロンプトと検索の違い', url: 'https://www.perplexity.ai/help-center/ja/articles/10354937-%E3%83%97%E3%83%AD%E3%83%B3%E3%83%97%E3%83%88%E3%81%A8%E6%A4%9C%E7%B4%A2%E3%81%AE%E9%81%95%E3%81%84%E3%81%AF%E4%BD%95%E3%81%A7%E3%81%99%E3%81%8B' },
            { label: 'Perplexity Docs — API Quickstart', url: 'https://docs.perplexity.ai/docs/getting-started/quickstart' }
          ];
          for (const source of sources) if (!urls.has(source.url)) item.sources.push(source);

          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/extend-ai-url-technique.yml
          git add data/techniques.json
          git commit -m "Add Claude Gemini and Perplexity URL patterns"
          git push
