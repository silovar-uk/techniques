name: Apply Personal Language Fingerprint Technique

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-personal-language-fingerprint.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add T-016 personal language fingerprint technique
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/techniques.json')
          data = json.loads(path.read_text())
          if any(item.get('id') == 'preserve-personal-language-fingerprint' for item in data):
              raise SystemExit('Technique already exists')

          item = {
            "id": "preserve-personal-language-fingerprint",
            "number": "T-016",
            "title": "AIで文章を整えても、自分の言葉の癖を消さない",
            "summary": "私的な文章をAIや校正で整えるときは、意味だけでなく、本人固有の語彙・迷い・確信度・言い直し・文の長短まで保存する。人間っぽい語を足すのではなく、自分固有の偏りを消さない。",
            "category": "文章・表現",
            "tags": ["文章", "AI", "文体", "個性", "idiolect", "stance", "モダリティ", "っぽい", "推敲", "私的文章"],
            "updated": "2026-08-31",
            "quickAnswer": "AIっぽさを消そうとして『なんか』『っぽい』『かも』を機械的に足さない。代わりに、自分が実際に使った副詞・曖昧さ・確信度・言い直し・文の長短・話題ごとの偏りを、意味がある限り残す。編集前後を比べて『誰でも書ける文章になったか？』を確認し、なっていたらVOICE LOSSとして戻す。",
            "steps": [
              "まず、その文章で自分らしさを担っている表現を確認する。例えば『なんとなく』『やっぱり』『〜な気がする』『〜っぽい』『かなぁ』『というか』、急に短くなる文、逆に妙に長くなる箇所など。",
              "AIへ渡すときは『自然な文章にして』だけで終えず、意味と読みやすさは整えてよいが、感情・確信度・迷い・言い直し・語彙の癖・文の長短は意味がある限り残すよう明示する。",
              "編集後は原文と比べる。内容が同じでも、『なんとなく似てる気がするんだよな』が『共通点があるように感じる』のように誰でも書ける表現へ均されていたらVOICE LOSSを疑う。",
              "曖昧表現を一律に削らない。『っぽい』『かも』『気がする』が対象の情報を曖昧にしているだけなのか、それとも書き手自身の確信度を正確に記録しているのかを分けて判断する。",
              "個性と品質の低さは分ける。誤字・事実誤認・意味不明・意図のない重複は直すが、本人固有の偏りは機械的に均一化しない。"
            ],
            "commands": [
              {
                "label": "VOICE PRESERVATION用プロンプト",
                "code": "意味と読みやすさは整えてください。ただし、私が使った副詞、感情の強度、迷い、確信度、言い直し、文の長短、口語的な語彙は、意味がある限り残してください。『一般的に自然な日本語』へ均一化するより、私がそのとき本当に使った言葉を優先してください。誤字・事実誤認・意味不明な箇所は直して構いません。編集後、本人らしさが失われた箇所があればVOICE LOSSとして示してください。",
                "note": "私的文章や本人の声を残したい文章をAIで推敲するときの基本指示。"
              }
            ],
            "explanation": [
              {
                "term": "PERSONAL LANGUAGE FINGERPRINT",
                "text": "本人らしさは特徴語1個ではなく、よく使う副詞、曖昧にする場面、断定する場面、文長、言い直し、話題ごとの解像度差などの『偏りの組み合わせ』として現れる。"
              },
              {
                "term": "VOICE LOSS",
                "text": "意味は保たれていても、AIや編集で語彙・確信度・リズム・話者の距離感が均され、誰でも書ける文章になること。文章が綺麗になったことと、本人らしさが残ったことは別。"
              },
              {
                "term": "『っぽい』は単なる雑さではない",
                "text": "『っぽい』には接尾辞用法だけでなくモダリティ的な用法も研究されている。『そう見える』『そう判断しているが完全には断定していない』という話者の態度を担う場合があり、一律に削るとstance情報を失うことがある。"
              },
              {
                "term": "Human-likeではなくMe-like",
                "text": "人間らしい共通テンプレートは作らない。『なんか』『かも』『っぽい』を追加すれば人間文になるわけではない。重要なのは、その人がどの場面で何をどの程度使うかという個人的な分布を保つこと。"
              },
              {
                "term": "AIによる均質化",
                "text": "2026年のNature Human Behaviour研究では、LLMによる書き直しは中心内容を保ちながら文章スタイルを均質化し、複数データセットでwriting-complexity varianceを21〜50%縮小した。AI利用時には内容保存だけでなく文体差の保存も監査対象になる。"
              }
            ],
            "tips": [
              "『なんか』『っぽい』『かなぁ』を毎回入れるテンプレートにはしない。それ自体が新しいAIっぽさになる。",
              "同じ人でも仕事・日記・人間関係・趣味で文体は変わる。単一の『自分文体』へ固定せず、topic × styleの関係も残す。",
              "重要な話題だけ妙に長く、どうでもいい部分は一言、というUNEQUAL ATTENTIONも本人らしさになりうる。全段落を同じ密度へ整えない。",
              "AI detectorを避けるための技術ではない。成功条件は『人間が書いたように見える』ではなく『自分が書いた感じが残る』こと。",
              "公的文章では正確性・組織としての一貫性が優先される場面が多い。VOICE PRESERVATIONは主に私的文章や個人の声が価値になる文章で使う。"
            ],
            "sources": [
              {
                "label": "Nature Human Behaviour — The shrinking landscape of linguistic diversity in the age of large language models",
                "url": "https://www.nature.com/articles/s41562-026-02550-0"
              },
              {
                "label": "System — Human-written vs. ChatGPT-generated texts: Stance in English research article abstracts",
                "url": "https://www.sciencedirect.com/science/article/pii/S0346251X25002520"
              },
              {
                "label": "Journal of English for Academic Purposes — Exploring the affordances of generative AI large language models for stance and engagement in academic writing",
                "url": "https://www.sciencedirect.com/science/article/pii/S147515852500030X"
              },
              {
                "label": "CiNii Research — 『っぽい』『くさい』『らしい』の接尾辞用法とそこから派生したモダリティ用法",
                "url": "https://cir.nii.ac.jp/crid/1390304471622583040"
              }
            ],
            "evidence": {
              "level": "SUPPORTED",
              "note": "LLMによる書き直しが文章スタイルの多様性を縮めうること、人間文とLLM文でstance表現の幅に差が報告されること、日本語の『っぽい』にモダリティ用法があることには研究上の支持がある。一方、特定の口語や曖昧語を残せば必ず本人らしさが高まると直接検証されたわけではないため、個人固有の言語的偏りを保存する実践的編集原則としてSUPPORTEDとする。"
            }
          }

          data.insert(0, item)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Validate technique data
        run: node scripts/validate-techniques.mjs

      - name: Commit data and remove temporary workflow
        run: |
          rm .github/workflows/apply-personal-language-fingerprint.yml
          git config user.name "silovar-uk"
          git config user.email "46244124+silovar-uk@users.noreply.github.com"
          git add data/techniques.json .github/workflows/apply-personal-language-fingerprint.yml
          git commit -m "Add personal language fingerprint technique"
          git push
